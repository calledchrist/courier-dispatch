root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/courierflow"
  cmd = "go build -o ./tmp/courierflow ./cmd/api"
  delay = 1000
  exclude_dir = ["tmp", "vendor", ".git", ".idea"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  include_ext = ["go", "env"]
  kill_delay = "500ms"
  log = "tmp/air-build-errors.log"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true

[color]
  app = "green"
  build = "yellow"
  main = "magenta"
  runner = "cyan"
  watcher = "blue"
